services:
  jsherp-mysql:
    image: mysql:8.0
    container_name: jsherp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${JSHERP_DB_PASS:-123456}"
      MYSQL_DATABASE: jsh_erp
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=mysql_native_password
      - --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - jsherp_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  jsherp-redis:
    image: redis:7-alpine
    container_name: jsherp-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "1234abcd"]
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "1234abcd", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

  jsherp-boot:
    build:
      context: .
      dockerfile: Dockerfile
    image: jsherp-boot:local
    container_name: jsherp-boot
    restart: unless-stopped
    depends_on:
      jsherp-mysql:
        condition: service_healthy
      jsherp-redis:
        condition: service_healthy
    environment:
      SERVER_PORT: "9999"
      DB_HOST: jsherp-mysql
      DB_PORT: "3306"
      DB_NAME: jsh_erp
      DB_USER: root
      DB_PASS: "${JSHERP_DB_PASS:-123456}"
      REDIS_HOST: jsherp-redis
      REDIS_PORT: "6379"
      REDIS_PASS: 1234abcd
      DISABLE_LOGIN_CAPTCHA: "1"
    ports:
      - "127.0.0.1:19999:9999"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9999/jshERP-boot/platformConfig/getPlatform/name || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  jsherp_mysql_data:
