[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-ontology"
version = "0.3.0"
description = "Pure M2 Symbolic World Model & Kinetic Governance Kernel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
prove = [
    "z3-solver>=4.13",
]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
include = ["open_ontology*"]
